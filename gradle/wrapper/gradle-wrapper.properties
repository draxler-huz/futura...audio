#
# Gradle Wrapper configuration for the Futura Audio multi-module build.
#
# The wrapper pins the exact Gradle distribution used by every developer
# machine, CI runner, and IDE. Gradle itself downloads the distribution
# on first invocation and caches it under ~/.gradle/wrapper/dists/.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

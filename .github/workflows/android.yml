# .github/workflows/android-build.yml
name: Android release APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android NDK and CMake
        # Versions match engine/build.gradle.kts (NDK 26.3.11579264) and
        # engine/CMakeLists.txt (CMake 3.22.1). The runner already has the SDK.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # No usable keystore: skip signing and build an unsigned release.
          # app/build.gradle.kts only signs when keystore.properties exists.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an unsigned release APK"
            exit 0
          fi
          # Filename MUST match what app/build.gradle.kts expects via
          # keystore.properties (storeFile=keystore.jks). Both paths are
          # git-ignored.
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks 2>/dev/null || true

          # A valid JKS or PKCS12 file is well over 100 bytes. Anything smaller
          # means the secret is not valid Base64, so fall back to unsigned.
          SIZE=$(stat -c%s app/keystore.jks 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 100 ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not valid Base64; building an unsigned release APK"
            rm -f app/keystore.jks
            exit 0
          fi

          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futura-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove local signing files
        if: always()
        run: rm -f app/keystore.jks app/keystore.properties
